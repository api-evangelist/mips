name: Mips
description: >-
  MIPS is a processor IP and compute company building embedded and edge AI
  silicon for automotive, robotics, and mission-critical systems. Its portfolio
  spans the MIPS RISC-V CPU families (M8500, I8500, P8700, S8200), the ARC
  processor and NPX/VPX accelerator lines, and development tooling such as MIPS
  Atlas Explorer virtual platforms and the ASIP Designer / ASIP Programmer
  toolchains. MIPS frames its offering around a "Sense, Think, Act, Communicate"
  signal chain for real-time autonomy — what it calls Physical AI at the edge.
  MIPS is a semiconductor IP licensor rather than a public web-API provider; this
  profile was surfaced as a Mayfield portfolio company and enriched with
  identity and probed security posture.
